name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python 3.10, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Mostrar versiones (evidencia de reproducibilidad)
        run: |
          python --version
          python -m pip list

      - name: Ejecutar pruebas
        run: python -m pytest -ra

  docker:
    name: pytest en Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t customer360 .

      - name: Ejecutar las pruebas dentro del contenedor
        run: docker run --rm customer360